spring.application.name=digital-wallet

server.port=8080

spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/digital_wallet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:80,http://127.0.0.1:80,http://localhost,http://127.0.0.1}

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method