services:

  mysql:
    build:
      context: ./database
      dockerfile: Dockerfile
    image: subalakx/digital-wallet-database:latest
    container_name: digital-wallet-mysql
    network_mode: host
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: subalakx/digital-wallet-backend:latest
    container_name: digital-wallet-backend
    network_mode: host
    environment:
      DB_URL: jdbc:mysql://127.0.0.1:3306/digital_wallet?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      CORS_ALLOWED_ORIGINS: http://localhost:80,http://127.0.0.1:80,http://localhost,http://127.0.0.1
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: subalakx/digital-wallet-frontend:latest
    container_name: digital-wallet-frontend
    network_mode: host
    depends_on:
      backend:
        condition: service_started

volumes:
  mysql_data: